services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: velio
      POSTGRES_PASSWORD: velio
      POSTGRES_DB: velio
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "velio"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

volumes:
  postgres-data:
